name: CarePrompt quality checks

on:
  push:
    branches: [main, ui-guided-nudges-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Compile Python files
        run: python -m compileall -q app.py components config pages services utils

      - name: Run automated tests
        run: pytest -q --tb=short

      - name: Smoke-test Streamlit startup
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/careprompt-streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          cat /tmp/careprompt-streamlit.log
          kill $APP_PID || true
          exit 1
